{% extends "admin/base.html" %}
{% block title %}{{ 'Edit Carousel' if item else 'Add Carousel' }} - Admin{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">
        {{ 'Edit Carousel Item' if item else 'Add New Carousel Item' }}
    </h1>

    <div class="bg-white p-6 rounded-lg shadow">
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Title</label>
                <input type="text" name="title" 
                       value="{{ item.title if item else '' }}"
                       class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Order</label>
                <input type="number" name="order" 
                       value="{{ item.order if item else 0 }}"
                       class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Image</label>
                {% if item and item.image %}
                <img src="{{ item.image_url }}" alt="{{ item.title }}" class="w-32 h-32 object-cover rounded mb-2">
                {% endif %}
                <input type="file" name="image" accept="image/*" {% if not item %}required{% endif %}
                       class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>

            <div class="flex gap-4">
                <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded hover:bg-emerald-700 transition">
                    {{ 'Update' if item else 'Add' }} Item
                </button>
                <a href="{{ url_for('admin_carousel') }}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded hover:bg-gray-300 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
