{% extends "admin/base.html" %}
{% block title %}Contact Info - Admin{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Contact Info</h1>

    <div class="bg-white p-6 rounded-lg shadow">
        <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Email</label>
                <input type="email" name="email" required 
                       value="{{ contact_info.email }}"
                       class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Address</label>
                <textarea name="address" rows="4"
                          class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">{{ contact_info.address }}</textarea>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Google Map Embed Code</label>
                <textarea name="google_map_embed" rows="4"
                          class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500 font-mono text-sm">{{ contact_info.google_map_embed }}</textarea>
                <p class="text-gray-500 text-sm mt-1">Paste the full iframe code from Google Maps</p>
            </div>

            <div class="flex gap-4">
                <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded hover:bg-emerald-700 transition">
                    Save Info
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
