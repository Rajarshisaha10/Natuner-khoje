{% extends "admin/base.html" %}
{% block title %}{{ 'Edit Contact Person' if person else 'Add Contact Person' }} - Admin{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">
        {{ 'Edit Contact Person' if person else 'Add New Contact Person' }}
    </h1>

    <div class="bg-white p-6 rounded-lg shadow">
        <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Name</label>
                <input type="text" name="name" required 
                       value="{{ person.name if person else '' }}"
                       class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Designation</label>
                <input type="text" name="designation" 
                       value="{{ person.designation if person else '' }}"
                       class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Contact No</label>
                <input type="text" name="contact_no" 
                       value="{{ person.contact_no if person else '' }}"
                       class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Order</label>
                <input type="number" name="order" 
                       value="{{ person.order if person else 0 }}"
                       class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>

            <div class="flex gap-4">
                <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded hover:bg-emerald-700 transition">
                    {{ 'Update' if person else 'Add' }} Person
                </button>
                <a href="{{ url_for('admin_contact_persons') }}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded hover:bg-gray-300 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
