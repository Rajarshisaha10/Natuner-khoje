{% extends "admin/base.html" %}
{% block title %}{{ 'Edit Blog Post' if post else 'Add Blog Post' }} - Admin{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">
        {{ 'Edit Blog Post' if post else 'Add New Blog Post' }}
    </h1>

    <div class="bg-white p-6 rounded-lg shadow">
        <form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Title</label>
                <input type="text" name="title" required 
                       value="{{ post.title if post else '' }}"
                       class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Content (Caption)</label>
                <textarea name="content" rows="8"
                          class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">{{ post.content if post else '' }}</textarea>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Image</label>
                {% if post and post.featured_image %}
                <img src="{{ post.image_url }}" alt="{{ post.title }}" class="w-32 h-32 object-cover rounded mb-2">
                {% endif %}
                <input type="file" name="image" accept="image/*" 
                       class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>

            <div class="flex gap-4">
                <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded hover:bg-emerald-700 transition">
                    {{ 'Update Post' if post else 'Add Post' }}
                </button>
                <a href="{{ url_for('admin_blog') }}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded hover:bg-gray-300 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
